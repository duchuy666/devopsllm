apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: pilot-network-delay
  namespace: sock-shop
spec:
  action: delay
  mode: one
  selector:
    namespaces: [sock-shop]
    labelSelectors: {name: front-end}
  direction: to
  target:
    mode: all
    selector:
      namespaces: [sock-shop]
      labelSelectors: {name: catalogue}
  delay:
    latency: 600ms
    jitter: 20ms
    correlation: "0"
  duration: 60s
