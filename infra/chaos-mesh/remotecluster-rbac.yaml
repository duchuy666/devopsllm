# Chaos Mesh 2.8.8 initializes a cluster-scoped RemoteCluster cache even when
# fault injection is namespace-scoped. Namespace metadata is also needed by the
# namespace annotation filter. These permissions do not grant fault injection.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shyn-chaos-remotecluster-reader
rules:
  - apiGroups: [chaos-mesh.org]
    resources: [remoteclusters]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shyn-chaos-remotecluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shyn-chaos-remotecluster-reader
subjects:
  - kind: ServiceAccount
    name: chaos-controller-manager
    namespace: chaos-mesh
