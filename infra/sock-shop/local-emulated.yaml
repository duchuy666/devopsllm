apiVersion: v1
kind: ConfigMap
metadata:
  name: shyn-frontend-tracing
  namespace: sock-shop
  annotations:
    thesis.shyn/source-sha256: 5f893fcbd50a1438bd1e1cd58bf42374747b480f88b22501e04fd46b84e513a7
data:
  frontend-tracing.js: "/* ES5-compatible, dependency-free Zipkin v1/B3 instrumentation\
    \ for Sock Shop.\n * Export HTTP metadata only. Never export headers, query strings\
    \ or bodies.\n */\n'use strict';\nvar http = require('http');\nvar url = require('url');\n\
    var crypto = require('crypto');\nvar domain = require('domain');\nvar originalRequest\
    \ = http.request;\nvar originalGet = http.get;\nvar originalServerEmit = http.Server.prototype.emit;\n\
    var collector = url.parse(process.env.SHYN_ZIPKIN_URL || 'http://jaeger.monitoring.svc.cluster.local:9411/api/v1/spans');\n\
    if (collector.protocol !== 'http:' || !collector.hostname || collector.auth) throw\
    \ new Error('Invalid local tracing endpoint');\nvar endpoint = {serviceName: 'front-end'};\n\
    var queue = [];\nvar dropped = 0;\nvar inflight = false;\n\nfunction id() { return\
    \ crypto.randomBytes(8).toString('hex'); }\nfunction valid(value, trace) {\n \
    \ return typeof value === 'string' && (trace ? /^(?:[a-f0-9]{16}|[a-f0-9]{32})$/\
    \ : /^[a-f0-9]{16}$/).test(value) && !/^0+$/.test(value);\n}\nfunction safePath(value)\
    \ {\n  var path = url.parse(String(value || '/')).pathname || '/';\n  var segments\
    \ = path.split('/').filter(function(part) {return part.length>0;});\n  if (!segments.length)\
    \ return '/';\n  var routes = ['catalogue','cart','orders','login','register','cards','addresses','customers','tags','health','metrics'];\n\
    \  if (routes.indexOf(segments[0])<0) return '/:route';\n  return '/'+segments.map(function(part,index)\
    \ {\n    if (index===0) return part;\n    return index===2 && ['cards','addresses','items'].indexOf(part)>=0\
    \ ? part : ':id';\n  }).join('/').slice(0,150);\n}\nfunction safePeer(value) {\n\
    \  var peer = String(value || '').toLowerCase().replace(/:\\d+$/,'');\n  var parts\
    \ = peer.split('.');\n  if (parts.length>1 && ['sock-shop','sock-shop.svc','sock-shop.svc.cluster.local'].indexOf(parts.slice(1).join('.'))<0)\
    \ return null;\n  var allowed = ['front-end','catalogue','user','carts','orders','payment','shipping','user-db','carts-db','orders-db','catalogue-db','rabbitmq','session-db','queue-master'];\n\
    \  return allowed.indexOf(parts[0])>=0 ? parts[0] : null;\n}\nfunction copy(object)\
    \ {\n  var result = {};\n  Object.keys(object || {}).forEach(function(key) { result[key]\
    \ = object[key]; });\n  return result;\n}\nfunction incoming(headers) {\n  var\
    \ trace = headers['x-b3-traceid'];\n  var parent = headers['x-b3-spanid'];\n \
    \ var sampled = headers['x-b3-sampled'] !== '0' && headers['x-b3-sampled'] !==\
    \ 'false';\n  var debug = headers['x-b3-flags'] === '1';\n  var single = headers.b3;\n\
    \  if (single === '0') sampled = false;\n  else if (single === '1' || single ===\
    \ 'd') { sampled = true; debug = single === 'd'; }\n  else if (typeof single ===\
    \ 'string') {\n    var fields = single.split('-');\n    if (valid(fields[0],true)\
    \ && valid(fields[1],false)) {\n      trace = fields[0]; parent = fields[1]; sampled\
    \ = fields[2] !== '0'; debug = fields[2] === 'd';\n    }\n  }\n  if (!valid(trace,true)\
    \ || !valid(parent,false)) { trace = id(); parent = null; }\n  return {traceId:trace,spanId:id(),parentId:parent,sampled:debug\
    \ || sampled,debug:debug};\n}\nfunction timer() { return {timestamp:Date.now()*1000,monotonic:process.hrtime()};\
    \ }\nfunction record(context,clock,name,kind,status,error,remote) {\n  if (!context.sampled)\
    \ return;\n  var elapsed = process.hrtime(clock.monotonic);\n  var duration =\
    \ Math.max(1,Math.round(elapsed[0]*1000000+elapsed[1]/1000));\n  var span = {traceId:context.traceId,id:context.spanId,name:name,timestamp:clock.timestamp,duration:duration,\n\
    \    annotations:[{timestamp:clock.timestamp,value:kind === 'server' ? 'sr' :\
    \ 'cs',endpoint:endpoint},\n                 {timestamp:clock.timestamp+duration,value:kind\
    \ === 'server' ? 'ss' : 'cr',endpoint:endpoint}],\n    binaryAnnotations:[{key:'http.status_code',value:String(status\
    \ || 0),endpoint:endpoint}]};\n  if (context.parentId) span.parentId = context.parentId;\n\
    \  if (error || status >= 500) span.binaryAnnotations.push({key:'error',value:true,endpoint:endpoint});\n\
    \  var peer=safePeer(remote);\n  if (peer) span.binaryAnnotations.push({key:'peer.service',value:peer,endpoint:endpoint});\n\
    \  if (queue.length < 1000) queue.push(span); else dropped++;\n}\nfunction flush()\
    \ {\n  if (inflight || !queue.length) return;\n  var batch = queue.splice(0,128);\n\
    \  var data = JSON.stringify(batch);\n  inflight = true;\n  var request = originalRequest.call(http,{hostname:collector.hostname,port:collector.port\
    \ || 80,\n    path:collector.path,method:'POST',headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(data)}},function(response)\
    \ {\n      response.resume();\n      response.on('end',function() { if (response.statusCode\
    \ < 200 || response.statusCode >= 300) dropped += batch.length; inflight = false;\
    \ });\n      response.on('error',function() { dropped += batch.length; inflight\
    \ = false; });\n    });\n  request.setTimeout(3000,function() { request.destroy();\
    \ });\n  request.on('error',function() { dropped += batch.length; inflight = false;\
    \ });\n  request.end(data);\n}\n\nhttp.Server.prototype.emit = function(event,request,response)\
    \ {\n  if (event !== 'request') return originalServerEmit.apply(this,arguments);\n\
    \  var server = this;\n  var context = incoming(request.headers);\n  var clock\
    \ = timer();\n  var active = domain.create();\n  active.shynTrace = context;\n\
    \  var result;\n  active.run(function() {\n    var finished = false;\n    function\
    \ finish(error) {\n      if (finished) return; finished = true;\n      record(context,clock,String(request.method\
    \ || 'GET')+' '+safePath(request.url),'server',response.statusCode,error);\n \
    \   }\n    response.once('finish',function() { finish(false); });\n    response.once('close',function()\
    \ { finish(true); });\n    result = originalServerEmit.call(server,event,request,response);\n\
    \  });\n  return result;\n};\n\nhttp.request = function(input) {\n  var parent\
    \ = domain.active && domain.active.shynTrace;\n  if (!parent) return originalRequest.apply(http,arguments);\n\
    \  var args = arguments;\n  var options = typeof input === 'string' ? url.parse(input)\
    \ : copy(input);\n  if (typeof args[1] === 'object') {\n    Object.keys(args[1]).forEach(function(key)\
    \ { options[key] = args[1][key]; });\n  }\n  if (Array.isArray(options.headers))\
    \ return originalRequest.apply(http,args);\n  options.headers = copy(options.headers);\n\
    \  Object.keys(options.headers).forEach(function(key) { if (/^x-b3-/i.test(key)\
    \ || key.toLowerCase() === 'b3') delete options.headers[key]; });\n  var context\
    \ = {traceId:parent.traceId,spanId:id(),parentId:parent.spanId,sampled:parent.sampled,debug:parent.debug};\n\
    \  options.headers['x-b3-traceid'] = context.traceId;\n  options.headers['x-b3-spanid']\
    \ = context.spanId;\n  options.headers['x-b3-parentspanid'] = context.parentId;\n\
    \  if (context.debug) options.headers['x-b3-flags'] = '1';\n  else options.headers['x-b3-sampled']\
    \ = context.sampled ? '1' : '0';\n  var callback = typeof args[args.length-1]\
    \ === 'function' ? args[args.length-1] : undefined;\n  var clock = timer();\n\
    \  var finished = false;\n  function finish(status,error) {\n    if (finished)\
    \ return; finished = true;\n    record(context,clock,'http:'+safePath(options.path),'client',status,error,options.hostname\
    \ || options.host);\n  }\n  var request = originalRequest.call(http,options,callback);\n\
    \  request.once('response',function(response) {\n    response.once('end',function()\
    \ { finish(response.statusCode,false); });\n    response.once('aborted',function()\
    \ { finish(response.statusCode,true); });\n  });\n  // Preserve Node's original\
    \ error handling, including an unhandled error throw.\n  var emit = request.emit;\n\
    \  request.emit = function(event) {\n    if (event === 'error' || event === 'abort')\
    \ finish(0,true);\n    return emit.apply(this,arguments);\n  };\n  return request;\n\
    };\nhttp.get = function() {\n  if (!(domain.active && domain.active.shynTrace))\
    \ return originalGet.apply(http,arguments);\n  var request = http.request.apply(http,arguments);\
    \ request.end(); return request;\n};\nvar interval = Number(process.env.SHYN_TRACE_FLUSH_MS\
    \ || 1000);\nif (!(interval >= 100 && interval <= 5000)) interval = 1000;\nsetInterval(flush,interval).unref();\n\
    var lastReportedDrop = 0;\nsetInterval(function() {\n  if (dropped !== lastReportedDrop)\
    \ {\n    console.error('SHYN_TRACE_EXPORT_DROPPED total='+dropped);\n    lastReportedDrop\
    \ = dropped;\n  }\n},30000).unref();\nmodule.exports = {safePath:safePath,safePeer:safePeer,flush:flush,diagnostics:function()\
    \ { return {queued:queue.length,dropped:dropped}; }};\n"
