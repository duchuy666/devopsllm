apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  namespace: sock-shop
  annotations:
    thesis.shyn/execution-mode: mixed-native-go-arm64-and-amd64-emulation
spec:
  replicas: 1
  selector:
    matchLabels:
      name: front-end
  template:
    metadata:
      labels:
        name: front-end
      annotations:
        thesis.shyn/frontend-tracing-sha256: 5f893fcbd50a1438bd1e1cd58bf42374747b480f88b22501e04fd46b84e513a7
    spec:
      containers:
      - name: front-end
        image: weaveworksdemos/front-end@sha256:26a2d9b6b291dee2dca32fca3f5bff6c2fa07bb5954359afcbc8001cc70eac71
        resources:
          limits:
            cpu: 300m
            memory: 1000Mi
          requests:
            cpu: 100m
            memory: 300Mi
        ports:
        - containerPort: 8079
        env:
        - name: SESSION_REDIS
          value: 'true'
        - name: SHYN_ZIPKIN_URL
          value: http://jaeger.monitoring.svc.cluster.local:9411/api/v1/spans
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /
            port: 8079
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /
            port: 8079
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        command:
        - node
        - --require
        - /opt/shyn-tracing/frontend-tracing.js
        - server.js
        args: []
        workingDir: /usr/src/app
        volumeMounts:
        - name: shyn-frontend-tracing
          mountPath: /opt/shyn-tracing
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - name: shyn-frontend-tracing
        configMap:
          name: shyn-frontend-tracing
          defaultMode: 292
  strategy:
    type: Recreate
