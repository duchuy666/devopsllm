apiVersion: v1
kind: Namespace
metadata:
  name: sock-shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  labels:
    name: carts
  namespace: sock-shop
  annotations:
    thesis.shyn/execution-mode: mixed-native-go-arm64-and-amd64-emulation
spec:
  replicas: 1
  selector:
    matchLabels:
      name: carts
  template:
    metadata:
      labels:
        name: carts
    spec:
      containers:
      - name: carts
        image: weaveworksdemos/carts@sha256:434d2f5a6e0e8beef1f253fe96f45b8437a703125fc003434c5282ecf8969a4f
        env:
        - name: JAVA_OPTS
          value: -Xms64m -Xmx128m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom
            -Dspring.zipkin.enabled=true -Dspring.zipkin.base-url=http://jaeger.monitoring.svc.cluster.local:9411
            -Dspring.sleuth.sampler.percentage=1.0 -XX:TieredStopAtLevel=1
        resources:
          limits:
            cpu: 1000m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 200Mi
        ports:
        - containerPort: 80
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - all
            add:
            - NET_BIND_SERVICE
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp-volume
        emptyDir:
          medium: Memory
      nodeSelector:
        kubernetes.io/os: linux
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: carts
  annotations:
    prometheus.io/scrape: 'true'
  labels:
    name: carts
  namespace: sock-shop
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    name: carts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-db
  labels:
    name: carts-db
  namespace: sock-shop
  annotations:
    thesis.shyn/execution-mode: mixed-native-go-arm64-and-amd64-emulation
spec:
  replicas: 1
  selector:
    matchLabels:
      name: carts-db
  template:
    metadata:
      labels:
        name: carts-db
      annotations:
        thesis.shyn/db-cache-hook-sha256: 39d44049314edd9529897d12988a2899dba0b278a01dc2ea3984426ee2ee40fa
    spec:
      containers:
      - name: carts-db
        image: mongo@sha256:d314f7eca9d3f825d091b77c40d2f3c9d6fff4de88dde2962527353476f107ba
        ports:
        - name: mongo
          containerPort: 27017
        securityContext:
          capabilities:
            drop:
            - all
            add:
            - CHOWN
            - SETGID
            - SETUID
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        - name: shyn-db-cache-policy
          mountPath: /opt/shyn-cache
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        lifecycle:
          postStart:
            exec:
              command:
              - sh
              - /opt/shyn-cache/init.sh
      volumes:
      - name: tmp-volume
        emptyDir:
          medium: Memory
      - name: shyn-db-cache-policy
        configMap:
          name: shyn-db-cache-policy
          defaultMode: 292
      nodeSelector:
        kubernetes.io/os: linux
  strategy:
    type: Recreate
---
apiVersion: v1
