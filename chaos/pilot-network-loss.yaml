apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: pilot-network-loss
  namespace: sock-shop
spec:
  action: loss
  mode: one
  selector:
    namespaces: [sock-shop]
    labelSelectors: {name: front-end}
  direction: to
  target:
    mode: all
    selector:
      namespaces: [sock-shop]
      labelSelectors: {name: catalogue}
  loss:
    loss: "20"
    correlation: "0"
  duration: 60s
