    matchLabels:
      name: catalogue-db
  template:
    metadata:
      labels:
        name: catalogue-db
      annotations:
        thesis.shyn/mysql-memory-sha256: c7013eaaf4239c720f8425c667f0673d59118e6302a02256a263a993fc62abde
    spec:
      containers:
      - name: catalogue-db
        image: weaveworksdemos/catalogue-db@sha256:7ba74ec9adf88f6625b8d85d3323d1ee5232b39877e1590021ea485cf9457251
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: fake_password
        - name: MYSQL_DATABASE
          value: socksdb
        ports:
        - name: mysql
          containerPort: 3306
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 2
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 60
        volumeMounts:
        - name: shyn-mysql-memory
          mountPath: /etc/mysql/conf.d/shyn-memory.cnf
          subPath: shyn-memory.cnf
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - name: shyn-mysql-memory
        configMap:
          name: shyn-mysql-memory
          defaultMode: 292
  strategy:
    type: Recreate
