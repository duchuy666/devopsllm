apiVersion: v1
kind: ConfigMap
metadata:
  name: shyn-db-cache-policy
  namespace: sock-shop
  annotations:
    thesis.shyn/source-sha256: 39d44049314edd9529897d12988a2899dba0b278a01dc2ea3984426ee2ee40fa
data:
  init.sh: "#!/bin/sh\n# A bounded postStart hook. Do not change mongod's startup\
    \ or seed-data command.\nset -eu\ncommand -v timeout >/dev/null 2>&1 || { echo\
    \ 'SHYN cache hook requires timeout' >&2; exit 78; }\ncommand -v mongo >/dev/null\
    \ 2>&1 || { echo 'SHYN cache hook requires mongo' >&2; exit 78; }\nattempt=0\n\
    while [ \"$attempt\" -lt 30 ]; do\n    attempt=$((attempt + 1))\n    if timeout\
    \ 5s mongo --quiet --host 127.0.0.1 --eval '\n        var r=db.adminCommand({setParameter:1,wiredTigerEngineRuntimeConfig:\"\
    cache_size=128M\"});\n        if (r.ok !== 1) quit(2);\n        var size=db.serverStatus().wiredTiger.cache[\"\
    maximum bytes configured\"];\n        if (size !== 134217728) quit(3);\n     \
    \   print(\"SHYN_DB_CACHE_READY bytes=\"+size);\n    '; then\n        exit 0\n\
    \    fi\n    sleep 1\ndone\necho 'SHYN cache hook did not obtain verified 128MiB\
    \ within bounded attempts' >&2\nexit 1\n"
