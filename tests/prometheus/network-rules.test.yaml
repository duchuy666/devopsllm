rule_files:
- /tmp/shyn-network-rules.yaml
evaluation_interval: 15s
tests:
- name: healthy routes
  interval: 15s
  input_series:
  - series: request_duration_seconds_sum{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+0.1x12
  - series: request_duration_seconds_count{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+10x12
  - series: request_duration_seconds_sum{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/orders"}
    values: 0+0.4x12
  - series: request_duration_seconds_count{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/orders"}
    values: 0+10x12
  alert_rule_test:
  - eval_time: 2m
    alertname: SockShopRequestSlow
    exp_alerts: []
- name: slow cart and orders retain route labels
  interval: 15s
  input_series:
  - series: request_duration_seconds_sum{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+5x12
  - series: request_duration_seconds_count{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+10x12
  - series: request_duration_seconds_sum{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/orders"}
    values: 0+6x12
  - series: request_duration_seconds_count{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/orders"}
    values: 0+10x12
  alert_rule_test:
  - eval_time: 15s
    alertname: SockShopRequestSlow
    exp_alerts: []
  - eval_time: 1m
    alertname: SockShopRequestSlow
    exp_alerts:
    - exp_labels:
        namespace: sock-shop
        service: front-end
        route: /cart
        severity: warning
      exp_annotations: &id001
        summary: HTTP route mean latency exceeds 250ms with at least five requests
          per minute
        description: Route latency is a symptom; inspect telemetry to identify the
          failing service or dependency.
    - exp_labels:
        namespace: sock-shop
        service: front-end
        route: /orders
        severity: warning
      exp_annotations: *id001
- name: slow but insufficient volume
  interval: 15s
  input_series:
  - series: request_duration_seconds_sum{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+1x12
  - series: request_duration_seconds_count{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+0.1x12
  alert_rule_test:
  - eval_time: 2m
    alertname: SockShopRequestSlow
    exp_alerts: []
- name: unrelated namespace and route
  interval: 15s
  input_series:
  - series: request_duration_seconds_sum{namespace="other",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+5x12
  - series: request_duration_seconds_count{namespace="other",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+10x12
  - series: request_duration_seconds_sum{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/health"}
    values: 0+5x12
  - series: request_duration_seconds_count{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/health"}
    values: 0+10x12
  alert_rule_test:
  - eval_time: 2m
    alertname: SockShopRequestSlow
    exp_alerts: []
- name: recovery
  interval: 15s
  input_series:
  - series: request_duration_seconds_sum{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+5x5 25+0.1x10
  - series: request_duration_seconds_count{namespace="sock-shop",job="kubernetes-service-endpoints",service="front-end",route="/cart"}
    values: 0+10x5 50+10x10
  alert_rule_test:
  - eval_time: 1m
    alertname: SockShopRequestSlow
    exp_alerts:
    - exp_labels:
        namespace: sock-shop
        service: front-end
        route: /cart
        severity: warning
      exp_annotations: *id001
  - eval_time: 3m
    alertname: SockShopRequestSlow
    exp_alerts: []
